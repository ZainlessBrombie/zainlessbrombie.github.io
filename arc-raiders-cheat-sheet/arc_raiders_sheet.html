    <script>
        fetch(location.href).then(async response => {
            const text = await response.text();
            setInterval(() => {
                fetch(location.href)
                    .then(async newResponse => {
                        if (text !== await newResponse.text()) {
                            location.reload();
                        }
                    })
            }, 1000);
        });
    </script>

    <script>
        window.searchListeners = [];
        window.onload = () => {
            const raritiesByKey = Object.fromEntries(window.data.rarities.map(rarity => [rarity.name, rarity]));
            const tagsByTagKey = Object.fromEntries(window.data.tags.map(tag => [tag.tagKey, tag]));
            const itemsByKey = Object.fromEntries(window.data.items.map(item => [item.itemKey, item]));
            const imagesByKey = Object.fromEntries(window.data.images.map(image => [image.imageKey, image]));

            function createItemTagNode(tagKey) {
                const itemTagNode = document.getElementById("template-item-tag").content.cloneNode(true);
                const tagData = tagsByTagKey[tagKey];
                if (!tagData) {
                    alert(`Tag not known: "${tagKey}"`);
                    return;
                }

                itemTagNode.querySelector(".tag-icon").src = imagesByKey[tagData.image]?.imageUrl;
                itemTagNode.querySelector(".tag-text").innerText = tagData.name;
                return itemTagNode;
            }

            function createItemNode(itemKey, itemCount) {
                const itemData = itemsByKey[itemKey];

                const itemNode = document.getElementById("template-item").content.cloneNode(true).children[0];

                const rarity = raritiesByKey[itemData.rarity];

                itemNode.style.cssText = `
                --item-image-url: url("${imagesByKey[itemData.image || itemData.itemKey]?.imageUrl}");
                --rarity-primary-color: ${rarity.primaryColor};
                --rarity-gradient-start-color: ${rarity.gradientTopLeft};
                --rarity-gradient-end-color: ${rarity.gradientBottomRight};
                `

                if (!itemData) {
                    alert(`Item not known: "${itemKey}"`)
                    return;
                }

                const itemCountNode = itemNode.querySelector(".top-right-resource-count");

                if (itemCount) {
                    itemCountNode.innerText = `${itemCount}x`;
                } else {
                    itemCountNode.remove();
                }

                itemNode.querySelector(".price-text").innerText = itemData.price;
                itemNode.querySelector(".item-name").innerText = itemData.name;
                itemNode.querySelector(".item-weight-text").innerText = itemData.weight;

                const tagsNode = itemNode.querySelector(".item-tags");
                itemData.tags.forEach(tag => {
                    tagsNode.append(createItemTagNode(tag));
                });

                window.searchListeners.push((text) => {
                    if (searchMatches(itemData.name, text)) {
                        itemNode.style.display = "flex";
                    } else {
                        itemNode.style.display = "none";
                    }
                });

                return itemNode;
            }

            function searchMatches(itemName, searchTerm) {
                return itemName.toLowerCase().includes(searchTerm.toLowerCase());
            }

            function createSection(title, items) {
                const sectionNode = document.getElementById("template-section").content.cloneNode(true);

                sectionNode.querySelector(".section-headline").innerText = title;
                sectionNode.querySelector(".item-count-pill").innerText = items.length + " ITEMS";
                const itemsSection = sectionNode.querySelector(".section-items");

                for (let item of items) {
                    itemsSection.append(createItemNode(item.itemKey, item.itemCount));
                }

                return sectionNode;
            }

            const sections = document.getElementById("sections");
            for (let section of window.data.sections) {
                const sectionNode = createSection(section.title, section.items);
                sections.append(sectionNode);
            }

            const searchInputNode = document.getElementById("search-input");
            searchInputNode.oninput = () => {
                console.log("OnChange")
                window.searchListeners.forEach(listener => listener(searchInputNode.value))
            }
        }
    </script>
</head>
<body>

    <h3 class="yellow-text underlined">Made by <a href="TODO">u/pRoDeeD</a></h3>
    <h3 class="yellow-text underlined">Interactivity added by u/ZainlessBrombie</h3>

    <label>
        <input type="text" class="search-bar" id="search-input" placeholder="Search Item...">
    </label>

    <div id="sections" class="sections">

    </div>
</div>
<template id="template-section">
    <div class="off-white" style="display: flex; flex-direction: row; width: 100%; align-items: center; gap: 10px;">
        <h2 class="section-headline">Keep for Projects</h2>
        <div class="item-count-pill">16 ITEMS</div>
        <div class="divider-line"></div>
    </div>
    <div class="section-items">
        <!-- Insert template-item here -->
    </div>

                <img src="money_icon.png" alt="" style="width: 1rem; aspect-ratio: 1"/>

        </div>

        <div class="item-text-part">
            <div class="item-name">Leaper Pulse Unit</div>
